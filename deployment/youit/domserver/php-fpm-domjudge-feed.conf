; Long-lived event streams must never consume judgehost/API worker capacity.
[domjudge-feed]
user = www-data
group = www-data
listen = /var/run/php-fpm-domjudge-feed.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = ondemand
pm.max_children = 8
pm.process_idle_timeout = 10s
pm.max_requests = 200
; Bound disconnected streams. The platform reconnects using since_token.
request_terminate_timeout = 330s
php_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/fpm-php.domjudge-feed.log
php_admin_value[memory_limit] = 768M
